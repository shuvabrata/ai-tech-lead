name: Commits per Repository
description: |-
  **What it is:** Aggregates and counts the total volume of raw code commits pushed to each repository.
  
  **How it helps:** Gives Management a rudimentary sense of where active development effort is currently concentrated across the organization's architecture.
  
  **What-If Impact:** While raw commit volume is a noisy metric, ignoring macro-level activity shifts can mask unexpected engineering effort being poured into supposedly "maintenance-only" legacy systems.
summary: "Count commits per repository."
default_view: tabular
owner: github-analytics
status: active
queries:
  tabular: |-
    MATCH (c:Commit)-[:PART_OF]->(b:Branch)-[:BRANCH_OF]-(r:Repository)
        WHERE b.is_default = true
        RETURN r.name as repo, count(c) as commits
        ORDER BY commits DESC
        LIMIT 100
  graph: |-
    MATCH p1=(c:Commit)-[:PART_OF]->(b:Branch)-[:BRANCH_OF]-(r:Repository)
        WHERE b.is_default = true
        RETURN p1
        LIMIT 100
tags:
- test
- table
- graph
