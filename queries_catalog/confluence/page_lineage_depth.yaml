name: Page Lineage Depth
description: |-
  **What it is:** Measures the hierarchical depth of pages within the Confluence tree structure.
  
  **How it helps:** Assists Administrators in auditing information architecture, ensuring that critical documentation isn't buried ten clicks deep in the hierarchy.
  
  **What-If Impact:** Deeply buried pages become unfindable, causing teams to recreate existing documentation or proceed without necessary compliance guidelines.
summary: "Measure how deep pages sit in the Confluence tree."
default_view: tabular
owner: confluence-analytics
status: active
queries:
  tabular: |-
    MATCH (p:Page)
    OPTIONAL MATCH path = shortestPath((p)-[:PARENT_OF*0..10]->(root:Page))
    RETURN p.title as page_title,
           CASE WHEN path IS NULL THEN 0 ELSE length(path) END as lineage_depth,
           root.title as root_title,
           p.status as status,
           p.last_updated_at as last_updated_at
    ORDER BY lineage_depth DESC, page_title
    LIMIT 100
  graph: |-
    MATCH p1=(p:Page)-[:PARENT_OF*1..10]->(ancestor:Page)
    RETURN p1
    LIMIT 100
tags:
- test
- table
- graph
